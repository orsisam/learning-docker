services:
    web-public:
        image: nginx:alpine
        ports:
            - "8088:80"
        networks:
            - frontend

    web-internal:
        image: nginx:alpine
        ports:
            - "127.0.0.1:8081:80"
        networks:
            internal_net:
                driver_opts:
                    com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

networks:
    frontend:
        driver: bridge
    internal_net:
        driver: bridge
